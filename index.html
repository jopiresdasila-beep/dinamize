<!doctype html>
<html lang="en">

    <title>Dinamize - Marketing Estratégico</title>
    <!-- Meta Pixel Code -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

  <body>
    <!-- Meta Pixel NoScript -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1349675053977186&ev=PageView&noscript=1"
    /></noscript>
    <!-- End Meta Pixel NoScript -->
    <!-- 
      Este formulário oculto é EXTREMAMENTE NECESSÁRIO para sites React (SPA).
      Os robôs do Netlify precisam ler esse HTML puro na hora do deploy para 
      registrar o formulário "contato" no painel. Depois disso, o envio por Javascript funciona.
    -->
    <form name="contato" data-netlify="true" hidden>
      <input type="text" name="name" />
      <input type="text" name="store" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
